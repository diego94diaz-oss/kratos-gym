<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4ecdf" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Entrenamiento" />
  <title>Entrenamiento</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/favicon-32.png?v=20261001" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=20261001">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Newsreader:wght@500;600&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===== LOGIN ===== -->
  <div id="auth-view" class="auth-view hidden">
    <div class="auth-card">
      <img class="auth-logo" src="assets/icon-192.png" alt="">
      <h1>Entrenamiento</h1>
      <p class="muted">Tu cuenta del ecosistema, en cualquier dispositivo.</p>
      <form id="auth-form">
        <input id="auth-email" type="email" placeholder="Email" autocomplete="email" required />
        <input id="auth-pass" type="password" placeholder="Contraseña" autocomplete="current-password" required />
        <button id="auth-submit" type="submit" class="btn btn-primary">Entrar</button>
      </form>
      <button id="auth-toggle" class="btn-link">¿Primera vez? Crear cuenta</button>
      <p id="auth-msg" class="auth-msg"></p>
    </div>
  </div>

  <!-- ===== CONFIG MISSING ===== -->
  <div id="config-view" class="auth-view hidden">
    <div class="auth-card"><h1>Falta configurar</h1><p class="muted">Edita <code>js/config.js</code> con tu URL y anon key de Supabase.</p></div>
  </div>

  <!-- ===== APP ===== -->
  <div id="app-view" class="app-view hidden">
    <header class="topbar">
      <img src="assets/icon-192.png" alt="">
      <b>Entrenamiento</b>
      <span id="sync-pill" class="sync-pill hidden" title="Registros por sincronizar"></span>
      <button id="theme-btn" class="icon-btn" aria-label="Cambiar tema">🌙</button>
      <button id="set-btn" class="icon-btn" aria-label="Ajustes">⚙️</button>
    </header>

    <main id="main" class="main"></main>

    <button id="fab" class="fab" aria-label="Registrar">＋</button>
    <nav class="tabbar">
      <button class="tab" data-tab="hoy">🏠<span>Hoy</span></button>
      <button class="tab" data-tab="entreno">🏋️<span>Entreno</span></button>
      <button class="tab" data-tab="nutricion">🍽️<span>Nutrición</span></button>
      <button class="tab" data-tab="cuerpo">⚖️<span>Cuerpo</span></button>
      <button class="tab" data-tab="salud">❤️<span>Salud</span></button>
    </nav>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <!-- Libs -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- App -->
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/push.js"></script>
  <script src="js/library.js"></script>
  <script src="js/foods.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/evidence.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views/hoy.js"></script>
  <script src="js/views/entreno.js"></script>
  <script src="js/views/nutricion.js"></script>
  <script src="js/views/cuerpo.js"></script>
  <script src="js/views/salud.js"></script>
  <script src="js/views/ajustes.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
    }
  </script>
</body>
</html>
